name: Deploy

on:
  # Sem `push`: o deploy e disparado pela pipeline unica (deploy-all.yml, no
  # mechanical-hub-infra) ou manualmente em Actions -> Deploy -> Run workflow.
  workflow_call:
    inputs:
      environment:
        description: Ambiente alvo
        required: false
        default: prod
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      AWS_ACCOUNT_ID:
        required: false
      TF_STATE_BUCKET:
        required: false
      LAB_ROLE_ARN:
        required: true
      DATABASE_PASSWORD:
        required: true
      TOKEN_SIGNING_KEY:
        required: true
      SMOKE_TEST_CPF:
        required: false
      SMOKE_TEST_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo
        required: true
        default: prod
        type: choice
        options: [prod]

permissions:
  contents: read

concurrency:
  # Deploy nao roda em paralelo: dois `terraform apply` simultaneos disputam o
  # mesmo estado.
  # Nome proprio por workflow (ver deploy.yml do mechanical-hub-infra).
  group: deploy-auth-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/terraform

jobs:
  build:
    name: Build e empacotamento
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: mechanical-hub-fiap/mechanical-hub-auth
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/package.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-bundles
          path: build/*.zip
          retention-days: 5

  deploy:
    name: Provisionar e publicar
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Em workflow_call o checkout padrao pega o repo CHAMADOR (mechanical-hub-infra);
      # o repositorio precisa ser explicito para rodar o codigo deste repo.
      - uses: actions/checkout@v4
        with:
          repository: mechanical-hub-fiap/mechanical-hub-auth
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: lambda-bundles
          path: build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # O AWS Academy Lab entrega credenciais temporarias (com session
          # token) que expiram a cada sessao do laboratorio. Atualize os
          # secrets do repositorio antes de rodar o deploy.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        # A key do state e fixa no bloco backend; bucket e regiao vem daqui,
        # para nao versionar o nome do bucket.
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET || format('mechanical-hub-tfstate-{0}', secrets.AWS_ACCOUNT_ID) }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_lambda_execution_role_arn: ${{ secrets.LAB_ROLE_ARN }}
          # Rede, URLs dos servicos (app_backend_base_urls) e banco do orders
          # (auth_database) vem dos states remotos (ADR-0002), nao de
          # secrets preenchidos a mao.
          TF_VAR_infra_state_bucket: ${{ secrets.TF_STATE_BUCKET || format('mechanical-hub-tfstate-{0}', secrets.AWS_ACCOUNT_ID) }}
          TF_VAR_database_state_bucket: ${{ secrets.TF_STATE_BUCKET || format('mechanical-hub-tfstate-{0}', secrets.AWS_ACCOUNT_ID) }}
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
          TF_VAR_token_signing_key: ${{ secrets.TOKEN_SIGNING_KEY }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        id: apply
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_lambda_execution_role_arn: ${{ secrets.LAB_ROLE_ARN }}
          # Rede, URLs dos servicos (app_backend_base_urls) e banco do orders
          # (auth_database) vem dos states remotos (ADR-0002), nao de
          # secrets preenchidos a mao.
          TF_VAR_infra_state_bucket: ${{ secrets.TF_STATE_BUCKET || format('mechanical-hub-tfstate-{0}', secrets.AWS_ACCOUNT_ID) }}
          TF_VAR_database_state_bucket: ${{ secrets.TF_STATE_BUCKET || format('mechanical-hub-tfstate-{0}', secrets.AWS_ACCOUNT_ID) }}
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}
          TF_VAR_token_signing_key: ${{ secrets.TOKEN_SIGNING_KEY }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Smoke test
        # Login, rota protegida com e sem token e webhook sem assinatura
        # (401 vindo do billing). Ver scripts/smoke-test.sh. Pressupoe os 4
        # servicos com targets saudaveis no NLB.
        env:
          SMOKE_CPF: ${{ secrets.SMOKE_TEST_CPF }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          API_BASE_URL="$(terraform -chdir=${{ env.TF_DIR }} output -raw api_base_url)" \
            bash scripts/smoke-test.sh

      - name: Publicar outputs
        # A URL do webhook muda a cada recriacao do API Gateway (reset do Lab) e
        # precisa ser reconfigurada a mao no painel do Mercado Pago.
        # Roda mesmo com o smoke test falhando: a URL do webhook continua util.
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "## Mechanical Hub Auth"
            echo
            echo "| Output | Valor |"
            echo "|---|---|"
            echo "| \`api_base_url\` | $(terraform output -raw api_base_url) |"
            echo "| \`login_url\` | $(terraform output -raw login_url) |"
            echo "| \`webhook_url\` | $(terraform output -raw webhook_url) |"
            echo
            echo "> Configure \`webhook_url\` no painel do Mercado Pago (notificacoes de Orders) se a API foi recriada."
            echo
            echo "### Backends resolvidos do mechanical-hub-infra (\`app_backend_base_urls\`)"
            echo
            echo '```json'
            terraform output -json resolved_app_backend_urls
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
